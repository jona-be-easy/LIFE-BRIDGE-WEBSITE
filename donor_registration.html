<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Registration - LIFE BRIDGE</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        * {
         box-sizing: border-box;
        }
      
        body{
            font-family: Arial, sans-serif;
            background-color:white;
            margin:0;
            padding:40px;
            color:#111;
        }

        .form-container{
            width: 90%;
            max-width: 450px;
            margin:auto;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 15px rgba(0,0,0,0.15);
        }
       .form-container h1{
            text-align:center;
            color:darkgreen;
        }

        .info-box{
    background:#F4F8F5;
    border-left:5px solid darkgreen;
    padding:15px;
    margin-bottom:20px;
    border-radius:5px;
}

.info-box h2{
    color:darkgreen;
    margin-top:0;
}

        label{
            display:block;
            margin-top:12px;
            font-weight:bold;
            color:black;
        }

        input:focus,
        select:focus{
           border:2px solid darkgreen;
           outline:none;
           background-color:white;
           box-shadow:0 0 5px rgba(0,100,0,0.3);
        }

    .consent-box{
        margin-top:15px;
        background:white;
        padding:10px;
        border-radius:5px;
}

        #registerButton{
            width:100%;
            margin-top:20px;
            padding:12px;
            background-color:darkgreen;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:1rem;
            transition:opacity 0.3s ease;
        }

 #registerButton{
    width:100%;
    margin-top:20px;
    padding:12px;
    background-color:darkgreen;
    color:white;
    border:none;
    border-radius:5px;

    transition:all 0.3s ease;
}

#registerButton:hover{
    opacity:0.85;
    transform:translateY(-2px);
}

#registerButton:active{
    opacity:0.6;
        }

.success{
    display:none;
    background:#d4edda;
    color:#155724;
    border:1px solid #c3e6cb;
    padding:12px;
    border-radius:5px;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}
        
.success.is-visible{display:block;}

        @media (max-width: 600px) {

            body { 
               padding:15px;
            }
            .form-container {
                width: 100%;
                padding: 20px; 
            }
            h1 {
                font-size: 24px;
            }

            input,
            select,
              #registerbutton{
                padding: 16px;
            }
       
        }

    </style>
</head>
<body>
    <div id="header"></div>
    <div id="navbar"></div>

    <main class="form-container">

        <h1>Donor Registration</h1>
        <div class="info-box">
    <h2>Become a Life-Saving Donor</h2>

    <p>
        By registering as an organ donor, you provide hope to
        patients waiting for life-saving transplants. Your decision
        today can make a lasting impact on others.
    </p>
</div>

        <form onsubmit="registerDonor(event)">

            <label>
                Full Name <span style="color:red;">*</span>
                <input type="text" required>
            </label>

            <label>
                Email Address <span style="color:red;">*</span>
                <input type="email" required>
            </label>

            <label>
                Phone Number<span style="color:red;">*</span>
                <input type="tel" required>
            </label>

            <label>
                Age <span style="color:red;">*</span>
                <input type="number" min="18", max="100" required>
            </label>

            <label>
                Gender <span style="color:red;">*</span>
            </label>

            <select required>
               <option value="">Select Gender</option>
               <option>Male</option>
                <option>Female</option>
            </select>

            <label>
                District <span style="color:red;">*</span>
            </label>

                <input type="text" required>

             <label>
                 Next of Kin Contact <span style="color:red;">*</span>
                 <input type="text" required>
             </label>
      <label>
          Phone Number <span style="color:red;">*</span>
          <input type="tel" 
              placeholder="07XXXXXXXX"
              required
              oninvalid="this.setCustomValidity('Please enter your phone number')"
              oninput="this.setCustomValidity('')">
      </label>

        <label>
            Blood group <span style="color:red;">*</span>
        </label>
            <select required>
                <option>Select Blood Group</option>
                <option>A+</option>
                <option>A-</option>
                <option>B+</option>
                <option>B-</option>
                <option>AB+</option>
                <option>AB-</option>
                <option>O+</option>
                <option>O-</option>
            </select>

            <label>Organ <span style="color:red;">*</span>
            </label>

            <select required>
                <option>Select Organ</option>
                <option>Kidney</option>
                <option>Liver</option>
                <option>Heart</option>
                <option>Lungs</option>
                <option>Pancreas</option>
                <option>Cornea</option>
            </select>

<div class="consent-box">

  <label>
    <input type="checkbox" required>

    I confirm that the information provided is
    accurate and that I voluntarily consent to
    organ donor registration.
  </label>

</div>

            <button type="submit" id="registerButton">
                Register As Donor
            </button>

        </form>

        <p class="success" id="successMessage">
            ✅ Registration Successful! Thank you for choosing to save lives.
        </p>

    </div>

   
     <div id="footer"></div>   
<script src="load-components.js"></script>

        <div style="text-align:center; margin-top:20px;">

<a href="index.html">
    ← Return to Home Page
</a>

</div>
<div id="footer"></div> 
</body>
</html>
